<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#d8e1e7"><title>随手控</title><style>
*{box-sizing:border-box}body{margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;color:#22333d}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation;transition:transform .18s,background .2s;color:inherit}button:active{transform:scale(.94)}button:disabled{opacity:.4}button:focus-visible,input:focus-visible{outline:2px solid #4b7387;outline-offset:3px}svg{width:24px;height:24px;fill:currentColor}[hidden]{display:none!important}.statusdot{width:6px;height:6px;border-radius:50%;background:#648676;display:inline-block}
.mobileview{min-height:calc(100svh - 48px);background:#d8e1e7;color:#22333d;position:relative;overflow:hidden;padding:30px 20px 25px;isolation:isolate}.ambient{position:absolute;inset:-20%;z-index:-2;filter:blur(55px);background:radial-gradient(ellipse at 20% 15%,#b1c7ee 0,transparent 38%),radial-gradient(ellipse at 90% 38%,#e9c6b2 0,transparent 42%),radial-gradient(ellipse at 23% 87%,#bddbcc 0,transparent 40%),linear-gradient(140deg,#d4e4ed,#dee1ea);animation:drift 18s ease-in-out infinite alternate}.grain{position:absolute;inset:0;z-index:-1;opacity:.13;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 140 140' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Cpath fill='%23000' filter='url(%23n)' opacity='.35' d='M0 0h140v140H0z'/%3E%3C/svg%3E")}.phone{max-width:368px;margin:auto;position:relative;animation:enter .5s ease both}.mobilehead{display:flex;align-items:center;justify-content:space-between;margin:0 4px 25px;font-size:13px}.mobilehead b{font-weight:600;letter-spacing:.5px}.mobilebadge{font-size:10px;color:#4d7069;display:flex;align-items:center;gap:6px}.mobilebadge .statusdot{background:#638d7a}.glass{background:linear-gradient(135deg,#ffffff85,#ffffff32 50%,#ffffff55);border:1px solid #ffffffb5;box-shadow:0 12px 32px #53697712,inset 0 1px 0 #ffffffd0,inset 0 -1px 0 #ffffff50;backdrop-filter:blur(25px) saturate(1.3);-webkit-backdrop-filter:blur(25px) saturate(1.3);position:relative}.glass:before{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(115deg,#ffffff60,transparent 27%,transparent 70%,#ffffff35);pointer-events:none}.mobilecard{padding:25px 24px 22px;border-radius:34px;overflow:hidden}.mobileeyebrow{display:flex;justify-content:center;gap:7px;align-items:center;color:#64717c;font-size:9px;letter-spacing:2px;margin-bottom:21px}.equalizer{height:12px;display:flex;gap:2px;align-items:center}.equalizer span{width:2px;background:#657e79;height:9px;animation:equalize .7s infinite alternate}.equalizer span:nth-child(2){animation-delay:-.4s;height:5px}.equalizer span:nth-child(3){animation-delay:-.2s;height:12px}.paused .equalizer span{animation-play-state:paused;height:3px}.cover{width:194px;aspect-ratio:1;margin:0 auto 23px;border-radius:24px;overflow:hidden;position:relative;background:linear-gradient(155deg,#9aafba,#647f85 55%,#344e61);box-shadow:0 16px 25px #334e6433,inset 0 1px 1px #ffffff90;transition:transform .5s}.cover:before{content:'';position:absolute;width:110px;height:110px;background:radial-gradient(circle,#f4dbad 0,#e1c696 35%,#d7c29600 70%);top:7px;right:-6px;opacity:.85}.cover .hill{position:absolute;width:290px;height:170px;border-radius:50%;left:-62px;top:96px;transform:rotate(-25deg);background:linear-gradient(10deg,#263f50,#87a19d);box-shadow:0 -2px 1px #d5e1ca50}.cover .hill.two{top:146px;left:-13px;transform:rotate(17deg);background:linear-gradient(140deg,#2e4859,#78918e)}.cover .coverword{position:absolute;left:18px;top:20px;color:#e9eee9;font-size:11px;letter-spacing:4px;font-weight:300}.cover .coverfine{position:absolute;bottom:15px;left:18px;color:#e2e8e2;font-size:7px;letter-spacing:2px}.playing .cover{animation:breathe 6s ease-in-out infinite}.mobilesong{text-align:center;font-size:25px;letter-spacing:1px;font-weight:600;margin:0 0 7px}.mobileartist{text-align:center;color:#71808a;font-size:11px;margin:0 0 23px}.progressline{height:4px;border-radius:6px;background:#748f9b21;overflow:hidden}.progressfill{height:100%;width:36%;background:#637b86;border-radius:5px;transition:width 1s linear}.timestamps{display:flex;justify-content:space-between;font-size:9px;font-variant-numeric:tabular-nums;color:#7c8a91;margin-top:8px}.mobilecontrols{display:flex;align-items:center;justify-content:center;gap:30px;margin:19px 0 2px}.mobilecontrols .iconbutton{width:40px;height:40px;color:#465e6b}.mobilecontrols .iconbutton:hover{background:#ffffff50}.mobilecontrols .mainplay{width:66px;height:66px;color:#365365;border:1px solid #ffffffc0;background:linear-gradient(135deg,#ffffffbb,#ffffff44);box-shadow:inset 0 2px 2px #fff,0 9px 20px #506e8525;backdrop-filter:blur(10px)}.mobilecontrols .mainplay svg{width:25px;height:25px}.mobilevolume{margin-top:16px;border-radius:25px;padding:18px 22px}.volumehead{display:flex;justify-content:space-between;font-size:11px;margin-bottom:12px;color:#637682}.volumehead output{color:#425d69;font-variant-numeric:tabular-nums}.volumerow{display:flex;align-items:center;gap:13px}.volumerow button{border:0;border-radius:50%;width:31px;height:31px;display:grid;place-items:center;background:#ffffff50;color:#56707e;font-size:21px}.volumerow input{width:100%;min-width:0;accent-color:#728d99;cursor:pointer;height:22px}.mobilebottom{margin:17px 2px 0;padding:13px 16px;border-radius:22px;display:flex;align-items:center;justify-content:space-between;font-size:10px;color:#71818a}.mobilebottom div{display:flex;gap:8px;align-items:center}.mobilebottom svg{width:15px;height:15px}.mobilebottom button{background:none;border:0;color:#566e7c;font-size:10px;padding:7px}.mobilefoot{text-align:center;font-size:9px;color:#83929c;margin-top:23px;letter-spacing:.5px}.rippling{animation:tapflash .42s ease}.mobilepair{border-radius:32px;padding:33px 25px;margin-top:75px;text-align:center}.mobilepair h2{font-size:24px;font-weight:500}.mobilepair p{color:#6e7e8a;font-size:12px;line-height:1.9}.mobilepair input{width:100%;padding:15px;background:#ffffff55;border:1px solid #ffffffbb;border-radius:14px;text-align:center;letter-spacing:8px;font-size:25px;color:#375463;margin:17px 0}.mobilepair button{width:100%;padding:14px;border:1px solid #fff;border-radius:14px;background:#ffffff88;color:#405d6d}.demoaside{font-size:10px;color:#81919b;text-align:center;margin:12px}.mobileview .mainplay:hover{background:#ffffffe0}

.mobileview{min-height:100svh}.mobilecontrols .mainplay{width:102px;font-size:13px;font-weight:600}.iconbutton{border:0;background:transparent;display:grid;place-items:center}.cover{animation:breathe 7s ease-in-out infinite}.volumeactions{display:flex;gap:12px;margin-top:12px}.volumeactions button{flex:1;border:1px solid #ffffffba;border-radius:15px;min-height:48px;background:#ffffff55;font-size:15px}.songtitle{font-size:22px;text-align:center;overflow-wrap:anywhere;margin:12px 0 6px;line-height:1.5}.subtitle{text-align:center;font-size:11px;color:#607784}.feedback{min-height:22px;text-align:center;font-size:11px;margin-top:15px;color:#4c6776}.connection{display:flex;align-items:center;gap:5px;font-size:10px;color:#607b75}.connection .dot{background:#999;width:6px;height:6px;border-radius:50%;display:inline-block}.connection.online .dot{background:#588b6c}.phone{max-width:385px}.mobilepair input{outline:none}.mobilecontrols{margin-top:25px}.mobilefoot{line-height:1.8}#pairError{color:#884d4d}footer{text-align:center;font-size:10px;color:#6a7a87;margin-top:24px}
@keyframes drift{to{transform:translate(4%,-3%) rotate(10deg) scale(1.1)}}@keyframes breathe{50%{transform:translateY(-3px)}}@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@media(max-width:350px){.mobileview{padding:24px 15px}.mobilecard{padding:22px 18px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><main class="mobileview"><div class="ambient"></div><div class="grain"></div><div class="phone"><header class="mobilehead"><b>随手控</b><span class="connection" id="connection"><i class="dot"></i><span id="connectionText">等待配对</span></span></header>
<form id="pair" class="mobilepair glass"><h2>连接你的音乐</h2><p>手机与电脑连接同一网络<br>输入电脑上显示的六位配对码</p><input id="code" aria-label="六位配对码" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required placeholder="••••••"><button type="submit">连接电脑</button><p id="pairError" role="alert"></p></form>
<section id="player" hidden><div class="mobilecard glass"><div class="mobileeyebrow">YOUR MUSIC, WITHIN REACH</div><div class="cover" aria-hidden="true"><div class="coverword">CLOUD MUSIC</div><div class="hill"></div><div class="hill two"></div><div class="coverfine">随手控</div></div><h1 class="songtitle" id="song">网易云音乐</h1><p class="subtitle" id="subtitle">声音在电脑，控制在手边</p><div class="mobilecontrols"><button class="iconbutton" data-action="previous" aria-label="上一首"><svg viewBox="0 0 24 24"><path d="M5 5h3v14H5zm14 0v14L9 12z"/></svg></button><button class="mainplay" data-action="toggle" aria-label="播放或暂停">播放 / 暂停</button><button class="iconbutton" data-action="next" aria-label="下一首"><svg viewBox="0 0 24 24"><path d="M16 5h3v14h-3zM5 5l10 7-10 7z"/></svg></button></div></div>
<div class="mobilevolume glass"><div class="volumehead"><span>网易云音量</span><span>每次调节一档</span></div><div class="volumeactions"><button data-action="volumeDown" aria-label="减小网易云音量">− 降低</button><button data-action="volumeUp" aria-label="增大网易云音量">+ 增大</button></div></div><div class="feedback" id="feedback" role="status" aria-live="polite"></div></section>
<footer>同一局域网 · 电脑端保持运行<br>随手控 1.0 · OpenAI Codex 编写</footer></div></main><script>
const $=id=>document.getElementById(id);let token=sessionStorage.getItem('musicRemoteToken')||'',busy=false;
async function request(path,body){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),6000);try{const r=await fetch(path,{method:body?'POST':'GET',headers:{'X-Remote-Token':token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,signal:controller.signal,cache:'no-store'});const data=await r.json();if(r.status===401){token='';sessionStorage.removeItem('musicRemoteToken');showPair();}if(!r.ok)throw new Error(data.error||'连接失败');return data;}catch(e){if(e.name==='AbortError')throw new Error('连接超时，请检查电脑和 Wi-Fi');throw e;}finally{clearTimeout(timer);}}
function showPair(){$('pair').hidden=false;$('player').hidden=true;$('connection').className='';$('connectionText').textContent='等待配对';}
function showPlayer(){$('pair').hidden=true;$('player').hidden=false;}
async function status(){if(!token||busy)return;try{const d=await request('/api/status');showPlayer();$('connection').className='online';$('connectionText').textContent='已连接电脑';$('song').textContent=d.title||'网易云音乐';$('subtitle').textContent=d.running?'声音在电脑，控制在手边':'请先在电脑上打开网易云音乐';}catch(e){$('connection').className='';$('connectionText').textContent='连接已断开';if(token)$('feedback').textContent=e.message;}}
$('pair').addEventListener('submit',async e=>{e.preventDefault();const b=e.submitter||$('pair').querySelector('button');b.disabled=true;$('pairError').textContent='';try{const d=await request('/api/pair',{code:$('code').value});token=d.token;sessionStorage.setItem('musicRemoteToken',token);showPlayer();await status();}catch(e){$('pairError').textContent=e.message;}finally{b.disabled=false;}});
const labels={next:'已发送：下一首',previous:'已发送：上一首',toggle:'已发送：播放 / 暂停',volumeUp:'已发送：音量增大',volumeDown:'已发送：音量减小'};
document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',async()=>{if(busy)return;busy=true;document.querySelectorAll('[data-action]').forEach(x=>x.disabled=true);try{await request('/api/control',{action:b.dataset.action});$('feedback').textContent=labels[b.dataset.action];}catch(e){$('feedback').textContent=e.message;}finally{busy=false;document.querySelectorAll('[data-action]').forEach(x=>x.disabled=false);setTimeout(status,450);}}));
const code=location.hash.slice(1);if(code){history.replaceState(null,'',location.pathname);if(/^\d{6}$/.test(code))$('code').value=code;}
if(token)status();setInterval(status,3000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)status();});
</script></body></html>
