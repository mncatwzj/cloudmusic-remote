<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111215"><title>网易云 · 随手控</title>
<style>
:root{color-scheme:dark;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:#111215;color:#f4f4f5}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:28px 22px}main{width:100%;max-width:420px}header{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:#aaa}header b{font-weight:600;color:#eee}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#74767c;margin-right:6px}.online .dot{background:#7ad5a0}.disc{height:180px;width:180px;border-radius:50%;margin:42px auto 30px;background:repeating-radial-gradient(circle,#25262b 0,#25262b 2px,#191a1e 3px,#191a1e 5px);display:grid;place-items:center;box-shadow:0 20px 70px #0008}.disc span{width:72px;height:72px;border-radius:50%;background:#ef4056;display:grid;place-items:center;font-size:34px;box-shadow:0 0 0 6px #111}h1{text-align:center;font-size:24px;line-height:1.4;margin:0;overflow-wrap:anywhere}p{text-align:center;color:#93959f;font-size:14px;margin:10px 0 24px}.controls{display:flex;align-items:center;justify-content:center;gap:22px;margin:28px 0}button{border:1px solid #36373f;border-radius:18px;background:#202126;color:#f4f4f5;font:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;min-height:54px}button:active{transform:scale(.96);background:#34353c}button:disabled{opacity:.4;cursor:wait}.skip{width:70px;height:66px;font-size:26px}.play{height:86px;width:100px;background:#ef4056;border:0;font-size:17px;font-weight:700}.play:active{background:#d7354a}.volume{border:1px solid #303138;border-radius:22px;padding:18px;display:flex;align-items:center;gap:16px}.volume div{flex:1;font-size:14px}.volume small{display:block;color:#93959f;font-size:11px}.volume button{width:58px;font-size:25px}footer{text-align:center;color:#73757f;font-size:12px;margin-top:30px}#feedback{min-height:24px;text-align:center;color:#f1b6be;font-size:13px;margin-top:18px}#pair{border:1px solid #303138;border-radius:22px;padding:24px;margin-top:40px}#pair h1{font-size:23px}input{width:100%;padding:15px;border:1px solid #444650;border-radius:12px;font:24px monospace;text-align:center;letter-spacing:8px;background:#18191e;color:white;outline:none}input:focus{border-color:#ef4056}#pair button{width:100%;margin-top:16px;background:#ef4056;border:0}#pairError{color:#f1b6be;margin:15px 0 0;font-size:13px}svg{width:25px;height:25px;vertical-align:middle;fill:currentColor}button:focus-visible{outline:2px solid white;outline-offset:4px}[hidden]{display:none!important}
</style></head><body><main><header><b>网易云 · 随手控</b><span id="connection"><i class="dot"></i><span id="connectionText">等待配对</span></span></header>
<form id="pair"><h1>把音乐，交给手机</h1><p>输入电脑工具上显示的 6 位配对码</p><input id="code" aria-label="六位配对码" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required placeholder="••••••"><button type="submit">连接电脑</button><p id="pairError" role="alert"></p></form>
<section id="player" hidden><div class="disc" aria-hidden="true"><span>♪</span></div><h1 id="song">网易云音乐</h1><p id="subtitle">声音在电脑，控制在手边</p><div class="controls"><button class="skip" data-action="previous" aria-label="上一首"><svg viewBox="0 0 24 24"><path d="M5 5h3v14H5zm14 0v14L9 12z"/></svg></button><button class="play" data-action="toggle" aria-label="播放或暂停">播放 / 暂停</button><button class="skip" data-action="next" aria-label="下一首"><svg viewBox="0 0 24 24"><path d="M16 5h3v14h-3zM5 5l10 7-10 7z"/></svg></button></div><div class="volume"><div>网易云音量<small>每按一次，调节一档</small></div><button data-action="volumeDown" aria-label="减小网易云音量">−</button><button data-action="volumeUp" aria-label="增大网易云音量">+</button></div><div id="feedback" role="status" aria-live="polite"></div></section><footer>同一局域网 · 电脑端保持运行<br>关闭电脑窗口后，工具会留在系统托盘</footer></main>
<script>
const $=id=>document.getElementById(id);let token=sessionStorage.getItem('musicRemoteToken')||'',busy=false;
async function request(path,body){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),6000);try{const r=await fetch(path,{method:body?'POST':'GET',headers:{'X-Remote-Token':token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,signal:controller.signal,cache:'no-store'});const data=await r.json();if(r.status===401){token='';sessionStorage.removeItem('musicRemoteToken');showPair();}if(!r.ok)throw new Error(data.error||'连接失败');return data;}catch(e){if(e.name==='AbortError')throw new Error('连接超时，请检查电脑和 Wi-Fi');throw e;}finally{clearTimeout(timer);}}
function showPair(){$('pair').hidden=false;$('player').hidden=true;$('connection').className='';$('connectionText').textContent='等待配对';}
function showPlayer(){$('pair').hidden=true;$('player').hidden=false;}
async function status(){if(!token||busy)return;try{const d=await request('/api/status');showPlayer();$('connection').className='online';$('connectionText').textContent='已连接电脑';$('song').textContent=d.title||'网易云音乐';$('subtitle').textContent=d.running?'声音在电脑，控制在手边':'请先在电脑上打开网易云音乐';}catch(e){$('connection').className='';$('connectionText').textContent='连接已断开';if(token)$('feedback').textContent=e.message;}}
$('pair').addEventListener('submit',async e=>{e.preventDefault();const b=e.submitter||$('pair').querySelector('button');b.disabled=true;$('pairError').textContent='';try{const d=await request('/api/pair',{code:$('code').value});token=d.token;sessionStorage.setItem('musicRemoteToken',token);showPlayer();await status();}catch(e){$('pairError').textContent=e.message;}finally{b.disabled=false;}});
const labels={next:'已发送：下一首',previous:'已发送：上一首',toggle:'已发送：播放 / 暂停',volumeUp:'已发送：音量增大',volumeDown:'已发送：音量减小'};
document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',async()=>{if(busy)return;busy=true;document.querySelectorAll('[data-action]').forEach(x=>x.disabled=true);try{await request('/api/control',{action:b.dataset.action});$('feedback').textContent=labels[b.dataset.action];}catch(e){$('feedback').textContent=e.message;}finally{busy=false;document.querySelectorAll('[data-action]').forEach(x=>x.disabled=false);setTimeout(status,450);}}));
const code=location.hash.slice(1);if(code){history.replaceState(null,'',location.pathname);if(/^\d{6}$/.test(code))$('code').value=code;}
if(token)status();setInterval(status,3000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)status();});
</script></body></html>
