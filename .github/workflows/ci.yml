name: Windows build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run tests
        shell: powershell
        run: |
          ./scripts/Build.ps1
          ./scripts/Test.ps1
